name: Build production branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets (frontend + backend)
        run: npm run build

      - name: Deploy production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/build-output
          cp -r dist /tmp/build-output
          # Copy production package manifest so deployments install only runtime deps
          if [ -f package.prod.json ]; then
            cp package.prod.json /tmp/build-output/dist/package.json
          else
            cp package.json /tmp/build-output/dist/package.json || true
          fi
          cp seed_db.js /tmp/build-output/dist/
          cp -r server /tmp/build-output/dist/
          cp -r shared /tmp/build-output/dist/
          git branch -D production || true
          git checkout --orphan production
          git reset --hard
          git clean -fdx
          cp -r /tmp/build-output/dist/. .
          rm -rf /tmp/build-output
          git add .
          git commit -m "Production build from ${{ github.sha }}" || true
          git push --force origin production
